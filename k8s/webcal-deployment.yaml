apiVersion: apps/v1
kind: Deployment
metadata:
  name: webcal-deployment
  labels:
    app: webcal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webcal
  template:
    metadata:
      labels:
        app: webcal
    spec:
      containers:
        - name: webcal-container
          image: bodukal/webcal:latest
          ports:
            - containerPort: 8080

