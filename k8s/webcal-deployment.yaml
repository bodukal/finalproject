apiVersion: apps/v1
kind: Deployment
metadata:
  name: webcal-deployment
  labels:
    app: webcal
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webcal
  template:
    metadata:
      labels:
        app: webcal
    spec:
      containers:
        - name: webcal-container
          image: bodukal/webcal:latest
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: webcal-service
spec:
  selector:
    app: webcal
  ports:
    - protocol: TCP
      port: 80           # External port
      targetPort: 8080   # Container port
  type: LoadBalancer

